<!DOCTYPE html>
<html>
  <head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <!-- Your CSS goes here -->
    <style>
#table_div {
  overflow-x: auto;
}

.google-visualization-table-table {
  table-layout: fixed !important;
  width: 800px !important;
}

.google-visualization-table-table th:nth-child(1),
.google-visualization-table-table td:nth-child(1) {
  width: 100px !important;
}

.google-visualization-table-table th:nth-child(2),
.google-visualization-table-table td:nth-child(2) {
  width: 280px !important;
}

.google-visualization-table-table th:nth-child(3),
.google-visualization-table-table td:nth-child(3) {
  width: 80px !important;
}

.google-visualization-table-table th:nth-child(4),
.google-visualization-table-table td:nth-child(4) {
  width: 100px !important;
}
    </style>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['table']});
      google.charts.setOnLoadCallback(drawTable);

      function drawTable() {
        var query = new google.visualization.Query(
	  'https://docs.google.com/spreadsheets/d/1P9Zq9jifGTqCLf6CnSrdFOvjj2Q_y0XTdPGn4CrTHSI/gviz/tq?range=A1:G'
        );
        query.send(handleQueryResponse);
      }

      function handleQueryResponse(response) {
        if (response.isError()) {
          alert('Error: ' + response.getMessage() + ' ' + response.getDetailedMessage());
          return;
        }

        var data = response.getDataTable();
	data.setColumnProperty(0, 'width', '120px');
  	data.setColumnProperty(1, 'width', '250px');
  	data.setColumnProperty(2, 'width', '80px');
  	data.setColumnProperty(3, 'width', '100px');

        var numRows = data.getNumberOfRows();
        var numCols = data.getNumberOfColumns();

        for (var row = 0; row < numRows; row++) {
          for (var col = 0; col < numCols; col++) {
            var cellValue = data.getValue(row, col);
            if (typeof cellValue === 'string' && cellValue.startsWith('http')) {
              var htmlLink = '<a href="' + cellValue + '" target="_blank" rel="noopener noreferrer">' + 'link' + '</a>';
              data.setFormattedValue(row, col, htmlLink);
            }
          }
        }

        var table = new google.visualization.Table(document.getElementById('table_div'));
        table.draw(data, {allowHtml: true, showRowNumber: false, height: '100%', width: '800px'});
      }


    </script>
  </head>
  <body>
    <div id="table_div"></div>
  </body>
</html>
